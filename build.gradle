buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://repo.spongepowered.org/maven' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.+', changing: true
    }
}
apply plugin: 'net.minecraftforge.gradle'
// Only edit below this line, the above code adds and enables the necessary things for Forge to be setup.
apply plugin: 'eclipse'
apply plugin: 'maven-publish'

version = "3.${modversion}-forge-${mcversion}"
group = 'com.LeoBeliik.convenientcurioscontainer' // http://maven.apache.org/guides/mini/guide-naming-conventions.html
archivesBaseName = 'convenientcurioscontainer'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: "official", version: "${mapversion}"

    runs {
        client {

            workingDirectory project.file('run')
            // Recommended logging data for a userdev environment
            //property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'

            // Recommended logging level for the console
            //property 'forge.logging.console.level', 'debug'

            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${buildDir}/createSrgToMcp/output.srg"

            mods {
                convenientcurioscontainer {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            // Recommended logging data for a userdev environment
            //property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'

            // Recommended logging level for the console
            //property 'forge.logging.console.level', 'debug'

            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${buildDir}/createSrgToMcp/output.srg"

            mods {
                convenientcurioscontainer {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')

            // Recommended logging data for a userdev environment
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'

            // Recommended logging level for the console
            property 'forge.logging.console.level', 'debug'
            args '--mod', 'convenientcurioscontainer', '--all', '--output', "\"" + file("src/generated/resources").toString() + "\"", "--validate", "--existing", "\"" + sourceSets.main.resources.srcDirs[0] + "\""

            mods {
                convenientcurioscontainer {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    maven {
        url "https://maven.neoforged.net/releases/"
    }
    maven {
        url = "https://maven.theillusivec4.top/"
    }
    maven {
        url = "https://api.modrinth.com/maven"
    }
    //accessories -------
    maven {
        url "https://maven.wispforest.io/releases"
    }
    maven {
        url "https://maven.fabricmc.net"
    }
    maven {
        url "https://maven.shedaniel.me"
    }
    maven {
        url "https://maven.su5ed.dev/releases"
    }
    //-------
}

dependencies {
    minecraft "net.minecraftforge:forge:${mcversion}-${forgeversion}"
    implementation fg.deobf("top.theillusivec4.curios:curios-forge:${curiosversion}")
    compileOnly fg.deobf("io.wispforest:accessories-neoforge:${accessories_version}")
    //runtimeOnly fg.deobf("maven.modrinth:accessories-cc-layer:${cclayer_version}")
    runtimeOnly fg.deobf("maven.modrinth:cloth-config:11.1.136+forge")
    compileOnly "dev.su5ed.sinytra.fabric-api:fabric-api:0.92.2+1.11.12+1.20.1"
    runtimeOnly fg.deobf("dev.su5ed.sinytra.fabric-api:fabric-api:0.92.2+1.11.12+1.20.1")
}


tasks.register("version_up") {
    doFirst {
        def gp = file("gradle.properties")
        def mv = "${modversion}".toInteger() + 1

        gp.setText(gp.getText().replace("modversion = " + "${modversion}", "modversion = " + mv.toString()))
    }
}

// Example for how to get properties into the manifest for reading by the runtime..
jar {
    manifest {
        attributes([
                "Specification-Title"     : mod_name,
                "Specification-Vendor"    : mod_author,
                "Specification-Version"   : project.jar.archiveVersion,
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : mod_author,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}
